    <main id="contenido">
      <h2>Contacto</h2>

      <form action="mailto:alex.garcia@example.com" method="post" enctype="text/plain">
        <fieldset>
          <legend>Envíame un mensaje</legend>

          <p>
            <label for="nombre">Nombre:</label>
            <input id="nombre" name="nombre" type="text" required />
          </p>

          <p>
            <label for="email">Correo electrónico:</label>
            <input id="email" name="email" type="email" required />
          </p>

          <p>
            <label for="asunto">Asunto:</label>
            <input id="asunto" name="asunto" type="text" required />
          </p>

          <p>
            <label for="mensaje">Mensaje:</label>
            <textarea id="mensaje" name="mensaje" rows="6" required></textarea>
          </p>

          <p>
            <button type="submit">Enviar</button>
          </p>
        </fieldset>
      </form>

      <p>
        También puedes escribirme directamente en
        <a href="mailto:alex.garcia@example.com">alex.garcia@example.com</a>
      </p>
      <p>
        <a href="https://github.com/usuario" target="_blank" rel="noopener noreferrer">GitHub</a>
      </p>
    </main>
